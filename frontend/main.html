<body>
    <header>
        <div id="yahoo-link">
            <h3> To look up the ticker of a security or browse securities you would like to invest in visit Yahoo Finance</h3>
            <a href="https://finance.yahoo.com/">https://finance.yahoo.com/</a>
        </div>
    </header>
    <main>
           <form id="tickers-form">
                <input id="tickers-input" placeholder="AAPL,MSFT,GOOGL">
                <button id="submit-btn">Submit</button>
            </form>

            <div id="response"></div>

    </main>
    <script>
       document.getElementById("tickers-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const input = document.getElementById("tickers-input").value;

    const tickers = input.split(","); 

    const query = new URLSearchParams({
        tickers: tickers.join(",")
    });

    try {
        const response = await fetch(`http://localhost:3010/expected-returns?${query}`);

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        
        document.getElementById("response").innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;



    } catch (err) {
        console.error(err);
        document.getElementById("response").innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
    }
});
    </script>
