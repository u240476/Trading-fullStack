
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav> 
            <a href="main.html">Main</a> 
            <a href="Graphs.html">Graphs</a> 
            <a href="Terminology.html">Terminology</a>
            <a href="About.html">About</a>

    <section id="graph-forms">
            <form id="graph-form">
                <h4>Graph a Securities Returns and Volatility</h4>
                <label for="graph-ticker-input">Enter a Stock Ticker</label>
                <input id="graph-ticker-input" placeholder="AAPL">
                <button>Add Stock</button>
            </form>
            <form id="graph-mvp-form">
                <h4>Graph a MVP's Returns and Volatility</h4>
                <label for="graph-mvp-tickers-input">Enter the Stocks to Build an MVP</label>
                <input id="graph-mvp-tickers-input" placeholder="AAPL">
                <button>Generate Portfolio</button>
            </form>
            <form id="graph-tp-form">
                <h4>Tangency Portfolio Weights</h4>
                <label for="graph-tp-tickers-input">Enter Stock Tickers</label>
                <input id="graph-tp-tickers-input" placeholder="AAPL,MSFT,GOOGL">
                <button type="submit" id="graph-tp-submit-btn">Submit</button>
            </form>
        </section>
         <canvas id="riskReturnChart"></canvas>
         <div id="graph-response"></div>
         <button type="button" id="clear-graph-button">Clear Graph</button>
        
        
    </section>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const portfolioData = [];

        const ctx = document.getElementById("riskReturnChart");

        const chart = new Chart(ctx, {
        type: "scatter",
        data: {
        datasets: [
            {
                label: "Stocks",
                data: []
            },
            {
                label: "Minimum Variance Portfolio",
                data: [],
                pointBackgroundColor: "green"
            },
            {
                label: "Tangency Portfolio",
                data: [],
                pointBackgroundColor: "red"
            }
        ]
        },
        options: {
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {

                        const point = context.raw;

                        return `${point.ticker}: 
                        Return ${point.y.toFixed(2)}%, 
                        Risk ${point.x.toFixed(2)}%`;
                    }
                }
            }
        },
            scales: {
                x: {
                    min:-10,
                    max: 30,
                    title: {
                        display: true,
                        text: "Standard Deviation (%)"
                    }
                },
            y: {
                min: -10,
                max: 30,
                title: {
                    display: true,
                    text: "Expected Return (%)"
                }
            }
        }
    }
});
        document.getElementById("clear-graph-button").addEventListener("click", () => {

            chart.data.datasets[0].data = [];
            chart.data.datasets[1].data = [];
            chart.data.datasets[2].data = [];

            portfolioData.length = 0;

            chart.update();
        });
        document.getElementById("graph-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const ticker = document
                .getElementById("graph-ticker-input")
                .value
                .trim()
                .toUpperCase();

            if (!ticker || ticker.includes(",")) {
                alert("Please enter only ONE ticker.");
                return;
            }
            try{
            const response = await fetch(
                `http://localhost:3010/api/graph-data?ticker=${ticker}`
            );

            const data = await response.json();

            const stock = {
                ticker: ticker,
                expectedReturn: data.expectedReturn * 100,
                standardDeviation: data.standardDeviation * 100
            };

            portfolioData.push(stock);

            chart.data.datasets[0].data.push({
            x: stock.standardDeviation,
            y: stock.expectedReturn,
            ticker: stock.ticker
        });

        chart.update();

        document.getElementById("graph-ticker-input").value = "";
        }catch(err){
            console.error(err);
        }
            
        });
         document.getElementById("graph-mvp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const tickers = document
                .getElementById("graph-mvp-tickers-input")
                .value
                .trim()
                .toUpperCase();

            if (!tickers) {
                alert("Please enter tickers.");
                return;
            }
            try{
            const response = await fetch(
                `http://localhost:3010/api/graph-mvp-data?tickers=${tickers}`
            );
            if (!response.ok) {
    const errText = await response.text();
    throw new Error(errText);
}

            const data = await response.json();

            const stock = {
                portfolioReturn: data.portfolioReturn * 100,
                portfolioStandardDeviation: data.portfolioStandardDeviation * 100
            };

            portfolioData.push(stock);

            chart.data.datasets[1].data.push({
                x: stock.portfolioStandardDeviation,
                y: stock.portfolioReturn,
                ticker: "mvp"
            });

        chart.update();

        document.getElementById("graph-mvp-tickers-input").value = "";
        }catch(err){
            console.error(err);
        }
            
        });
        document.getElementById("graph-tp-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const tickers = document
                .getElementById("graph-tp-tickers-input")
                .value
                .trim()
                .toUpperCase();

            if (!tickers) {
                alert("Please enter tickers.");
                return;
            }
            try{
            const response = await fetch(
                `http://localhost:3010/api/graph-tp-data?tickers=${tickers}`
            );
            if (!response.ok) {
    const errText = await response.text();
    throw new Error(errText);
}

            const data = await response.json();

            const stock = {
                portfolioReturn: data.portfolioReturn * 100,
                portfolioStandardDeviation: data.portfolioStandardDeviation * 100
            };

            portfolioData.push(stock);

            chart.data.datasets[2].data.push({
                x: stock.portfolioStandardDeviation,
                y: stock.portfolioReturn,
                ticker: "tp"
            });

        chart.update();

        document.getElementById("graph-tp-tickers-input").value = "";
        }catch(err){
            console.error(err);
        }
            
        });

    </script>
